name: prepare-environment
description: Prepares the build environment
runs:
  using: "composite"
  steps:
    - name: Prepares the build environment
      run: |
        mkdir -p ${{github.workspace}}/build
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends \
           tar \
           wget \
           cmake \
           buildah \
           ninja-build \
           clang \
           clang-tidy \
           pkg-config \
           build-essential
      shell: bash

